[package]
name = "debian_service_test_server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.94"
clap = { version = "4.5.20", features = ["derive"] }
log = "0.4.22"
netdev = "0.31.0"
prost = "0.13.3"
tokio = { version = "1.40.0", features = ["rt-multi-thread"] }
tokio-stream = "*"
tonic = "0.12.3"
async-stream = "0.3"

[build-dependencies]
tonic-build = "0.12.3"

[package.metadata.deb]
maintainer = "ferrochrome-dev@google.com"
copyright = "2025, The Android Open Source Project"
depends = "$auto"
maintainer-scripts = "debian/"
systemd-units = { }
